name: Weekly brief

on:
  schedule:
    # Mondays 08:00 UTC. The brief covers the preceding week.
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      max_results:
        description: Items to fetch per source
        default: "25"

jobs:
  brief:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to commit the generated brief back

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # The database is the idempotency layer: restoring it means unchanged
      # items are not re-analyzed, so a re-run costs only what is genuinely new.
      - name: Restore item database
        uses: actions/cache@v4
        with:
          path: monitor.db
          key: monitor-db-${{ github.run_id }}
          restore-keys: monitor-db-

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional. Raises the GitHub API limit from 60 to 5000 requests/hour,
          # which matters when the agent is reading repository files.
          GITHUB_TOKEN: ${{ secrets.GH_API_TOKEN }}
        run: |
          python run.py \
            --graph \
            --sources arxiv github hn \
            --max-results ${{ github.event.inputs.max_results || 25 }} \
            --agent \
            --agent-limit 5

      - name: Commit brief
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f reports/*.md
          git diff --staged --quiet || git commit -m "brief: $(date -u +%Y-W%V)"
          git push

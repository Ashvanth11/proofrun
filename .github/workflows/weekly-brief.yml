name: Weekly monitoring

on:
  schedule:
    # Mondays 08:17 UTC; avoid the busiest top-of-hour scheduling window.
    - cron: "17 8 * * 1"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Start with an empty database only after reviewing missing history
        type: boolean
        default: false

concurrency:
  group: proofrun-weekly-monitoring
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  monitor:
    # Activation requires both variables; the old workflow is replaced at this path.
    if: vars.WEEKLY_MONITORING_ENABLED == 'true' && vars.MONITORING_PROVIDER == 'anthropic'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Restore durable monitoring state
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: |
          if [ "$BOOTSTRAP" = "true" ]; then
            python scripts/restore_monitor_state.py --repo "$REPOSITORY" --bootstrap
          else
            python scripts/restore_monitor_state.py --repo "$REPOSITORY"
          fi
      - name: Build execution sandbox
        run: docker build -t ai-monitor-sandbox:latest sandbox/
      - name: Discover and investigate one repository
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_API_TOKEN || github.token }}
        run: python weekly_monitor.py
      - name: Save state even after a failed attempt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proofrun-monitor-state
          path: weekly-state/
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve the existing public showcase
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published-site
          persist-credentials: false
      - name: Export shared feed and weekly page
        run: python export_monitoring.py --db weekly-state/monitor.db --out published-site --run-record weekly-state/last-run.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: published-site

  deploy:
    needs: monitor
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy weekly results
        id: deployment
        uses: actions/deploy-pages@v4

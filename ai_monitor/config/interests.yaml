# The four technical areas below describe *research and tooling*. The eval
# surfaced a gap: a $13B acquisition matched none of them, yet is obviously
# major news - both models scored it ~0.2 and were correct by the rubric.
# `ecosystem` closes that gap. See docs/eval-findings.md.
areas:
  ecosystem:
    description: >
      Significant events in the AI industry rather than technical
      contributions: major model releases and their capabilities,
      acquisitions and funding of consequential labs or tools, notable
      shutdowns or licence changes, and incidents with real consequences
      (serious security failures, misuse, regulatory action).

      Score on consequence, not drama. A frontier model release, or one lab
      acquiring another, changes what people can build and is high relevance.
      Funding rounds, benchmark leaderboard shuffles, executive moves, and
      opinion pieces about where the field is heading are low - they are
      commentary on the field rather than changes to it.
    keywords:
      - release
      - launches
      - announces
      - acquisition
      - acquires
      - acquire
      - acquiring
      - open-sources
      - open source release
      - deprecated
      - shutting down
      - license change
      - lawsuit
      - regulation
      - breach
      - incident
      - funding
      - raises

  agents:
    description: >
      Multi-agent systems, agentic workflows, LLM tool use, planning,
      reasoning-action loops, and agent orchestration frameworks.
    keywords:
      - agent
      - multi-agent
      - agentic
      - tool use
      - tool calling
      - function calling
      - planning
      - orchestration
      - autonomous
      - mcp
      - model context protocol

  evals-and-safety:
    description: >
      Evaluation of LLM systems and AI safety: benchmarks, LLM-as-judge,
      hallucination detection, guardrails, red-teaming, interpretability.
    keywords:
      - evaluation
      - eval
      - benchmark
      - llm-as-judge
      - hallucination
      - guardrail
      - red team
      - red-teaming
      - interpretability
      - alignment
      - safety
      - jailbreak

  new-architectures:
    description: >
      Alternatives and extensions to the standard transformer: attention
      variants, state-space models, long-context methods, novel training
      or architecture ideas.
    keywords:
      - architecture
      - attention
      - transformer
      - state space
      - mamba
      - ssm
      - long context
      - mixture of experts
      - moe
      - sparse
      - recurrent
      - diffusion language model

  llm-observability:
    description: >
      Tracing, monitoring, cost tracking, and eval pipelines for LLM
      applications in production.
    keywords:
      - observability
      - tracing
      - telemetry
      - monitoring
      - langfuse
      - phoenix
      - opentelemetry
      - cost tracking
      - token usage
      - logging
